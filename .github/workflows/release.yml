name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check scripts and extension
        run: |
          bash -n scripts/release.sh scripts/package.sh
          node --check popup.js
          node --check transcript.js
          node tests/transcript.test.cjs
      - name: Package committed extension
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            scripts/package.sh "$REF_NAME"
          else
            scripts/package.sh
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: extension
          path: dist
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          # Completed releases are left alone when a workflow is rerun.
          if [[ $(gh release view "$TAG" --json isDraft --jq .isDraft) == true ]]; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false
          fi
