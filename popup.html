<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Transcript Grabber</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Slop, to go.</h1>
  <p id="status" role="status" aria-live="polite">Opening the transcript…</p>
  <textarea id="transcript" aria-label="Video transcript" readonly hidden></textarea>
  <button id="copy" hidden>Copy transcript</button>
  <button id="retry" hidden>Try again</button>
  <p class="hint">Twenty minutes of waffle. One clipboard.</p>
  <script src="transcript.js"></script>
  <script src="popup.js"></script>
</body>
</html>
